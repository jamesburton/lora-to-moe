[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lora-to-moe"
version = "0.1.0"
description = "Compose independently trained LoRA experts into measured, routable expert graphs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "lora-to-moe contributors" }]
dependencies = []

[project.optional-dependencies]
research = [
  "accelerate>=1.7",
  "bitsandbytes>=0.45",
  "datasets>=3.6",
  "evaluate>=0.4",
  "peft>=0.15",
  "safetensors>=0.5",
  "torch>=2.7",
  "transformers>=4.51",
]
dev = [
  "jsonschema>=4.23",
  "pytest>=8.3",
  "ruff>=0.11",
]

[project.scripts]
lora-moe = "lora_moe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
